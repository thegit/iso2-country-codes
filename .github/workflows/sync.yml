name: Sync data from iso2.com

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC, after the site's weekly refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest data
        run: python scripts/sync.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name "iso2-sync"
          git config user.email "iso2-sync@users.noreply.github.com"
          git add -A
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
